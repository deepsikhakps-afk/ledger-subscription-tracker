<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Subscription Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>Ledger</div>
      <button id="addBtn" class="add-btn">+ Add subscription</button>
    </header>

    <main class="main">
      <!-- Summary cards -->
      <section class="summary">
        <div class="stat-card">
          <span class="stat-label">Monthly total</span>
          <span id="monthlyTotal" class="stat-value">$0.00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Yearly total</span>
          <span id="yearlyTotal" class="stat-value">$0.00</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Active subscriptions</span>
          <span id="activeCount" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Next renewal</span>
          <span id="nextRenewal" class="stat-value">—</span>
        </div>
      </section>

      <!-- Spend by category chart -->
      <section class="chart-panel">
        <h2>Spend by category</h2>
        <canvas id="categoryChart" width="600" height="220"></canvas>
        <div id="chartLegend" class="chart-legend"></div>
      </section>

      <!-- Subscription list -->
      <section class="list-panel">
        <div class="list-header">
          <h2>Your subscriptions</h2>
          <select id="sortSelect">
            <option value="renewal">Sort by renewal date</option>
            <option value="price-desc">Sort by price (high→low)</option>
            <option value="price-asc">Sort by price (low→high)</option>
            <option value="name">Sort by name</option>
          </select>
        </div>
        <ul id="subList" class="sub-list"></ul>
        <div id="emptyState" class="empty-state">
          <p>No subscriptions yet.</p>
          <p class="empty-sub">Click "+ Add subscription" to track your first one.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Add/Edit modal -->
  <div id="modalOverlay" class="modal-overlay">
    <form id="subForm" class="modal">
      <h2 id="modalTitle">Add subscription</h2>
      <input type="hidden" id="subId">

      <label>Name
        <input type="text" id="subName" placeholder="Netflix" required>
      </label>

      <label>Price
        <input type="number" id="subPrice" placeholder="15.99" min="0" step="0.01" required>
      </label>

      <label>Billing cycle
        <select id="subCycle">
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
          <option value="weekly">Weekly</option>
        </select>
      </label>

      <label>Category
        <select id="subCategory">
          <option value="Entertainment">Entertainment</option>
          <option value="Productivity">Productivity</option>
          <option value="Fitness">Fitness</option>
          <option value="Utilities">Utilities</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>Next renewal date
        <input type="date" id="subDate" required>
      </label>

      <label class="checkbox-label">
        <input type="checkbox" id="subReminder"> Remind me 2 days before renewal
      </label>

      <div class="modal-actions">
        <button type="button" id="deleteBtn" class="danger-btn hidden">Delete</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="ghost-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
